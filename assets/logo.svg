@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --navy: #142B4A;
  --teal: #167D9A;
  --amber: #E7A64B;
  --light: #F2F5F8;
  --white: #FFFFFF;
  --slate: #53657B;
  --text: #1E2A39;
  --border: rgba(20, 43, 74, 0.12);
  --shadow: 0 18px 45px rgba(20, 43, 74, 0.12);
  --shadow-soft: 0 12px 28px rgba(20, 43, 74, 0.08);
  --radius: 22px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(180deg, #f8fafc 0%, var(--light) 100%);
  color: var(--text);
  line-height: 1.65;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, textarea, select { font: inherit; }

.container {
  width: min(1200px, calc(100% - 2rem));
  margin: 0 auto;
}
.section { padding: 5.5rem 0; }
.section-header {
  max-width: 700px;
  margin: 0 auto 2.75rem;
  text-align: center;
}
.eyebrow {
  display: inline-block;
  margin-bottom: 0.9rem;
  padding: 0.45rem 0.85rem;
  background: rgba(22, 125, 154, 0.08);
  border: 1px solid rgba(22, 125, 154, 0.18);
  color: var(--teal);
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  line-height: 1;
}
h1, h2, h3, h4 {
  margin: 0 0 1rem;
  line-height: 1.08;
  letter-spacing: -0.04em;
  color: var(--navy);
}
h1 { font-size: clamp(2.6rem, 5vw, 5rem); }
h2 { font-size: clamp(2rem, 3vw, 3rem); }
h3 { font-size: clamp(1.2rem, 2vw, 1.5rem); }
p {
  margin: 0 0 1rem;
  color: var(--slate);
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255,255,255,0.84);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 84px;
  gap: 1rem;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}
.brand img {
  width: 60px;
  height: 60px;
  border-radius: 17px;
  box-shadow: var(--shadow-soft);
}
.brand-copy {
  display: flex;
  flex-direction: column;
  gap: 0.18rem;
  line-height: 1;
}
.brand-copy strong {
  font-size: 0.76rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--navy);
}
.brand-copy span {
  font-size: 0.82rem;
  color: var(--teal);
  font-weight: 700;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 1.35rem;
  flex-wrap: wrap;
  justify-content: center;
}
.nav-links a {
  position: relative;
  font-size: 0.94rem;
  font-weight: 600;
  color: var(--navy);
  opacity: 0.82;
  transition: opacity 0.2s ease;
}
.nav-links a:hover,
.nav-links a.active { opacity: 1; }
.nav-links a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -8px;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--teal), var(--amber));
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 0.2s ease;
}
.nav-links a:hover::after,
.nav-links a.active::after { transform: scaleX(1); }
.nav-actions {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}
.currency-switcher {
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.72rem 0.9rem;
  background: var(--white);
  color: var(--navy);
  font-weight: 600;
  min-width: 122px;
}
.btn, .link-btn, button[type="submit"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  border: none;
  border-radius: 999px;
  padding: 0.9rem 1.5rem;
  background: var(--navy);
  color: var(--white);
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  box-shadow: 0 10px 22px rgba(20, 43, 74, 0.18);
}
.btn:hover, .link-btn:hover, button[type="submit"]:hover { transform: translateY(-1px); }
.btn.secondary {
  background: transparent;
  color: var(--navy);
  border: 1px solid rgba(20, 43, 74, 0.16);
  box-shadow: none;
}
.btn.secondary.light {
  border-color: rgba(255,255,255,0.25);
  color: var(--white);
  background: rgba(255,255,255,0.04);
}
.btn.accent {
  background: linear-gradient(135deg, var(--amber), #efc678);
  color: var(--navy);
}
.mobile-toggle {
  display: none;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--white);
  padding: 0.55rem 0.7rem;
}

.hero {
  position: relative;
  overflow: hidden;
  padding: 4.2rem 0 5.2rem;
  background:
    linear-gradient(135deg, rgba(20,43,74,0.96), rgba(20,43,74,0.8)),
    url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 34% auto auto -8%;
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(22,125,154,0.4), transparent 66%);
  filter: blur(24px);
}
.hero::after {
  content: '';
  position: absolute;
  inset: auto -8% -16% auto;
  width: 36%;
  height: 36%;
  background: radial-gradient(circle, rgba(231,166,75,0.34), transparent 60%);
  filter: blur(28px);
}
.hero-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 2.5rem;
  align-items: center;
}
.hero-copy { color: var(--white); }
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1.1rem;
  padding: 0.46rem 0.8rem;
  border-radius: 999px;
  color: var(--white);
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.18);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}
.hero-copy p {
  max-width: 620px;
  font-size: 1.08rem;
  color: rgba(255,255,255,0.8);
}
.hero-copy h1 { color: var(--white); }
.hero-copy .highlight {
  color: #f2f7ff;
  text-shadow: 0 0 26px rgba(255,255,255,0.18);
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 1.7rem;
}
.hero-highlights {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 1.7rem;
}
.stat-pill {
  min-width: 155px;
  padding: 0.95rem 1rem;
  border-radius: 18px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
}
.stat-pill strong {
  display: block;
  font-size: 1.75rem;
  color: var(--white);
  margin-bottom: 0.2rem;
}
.stat-pill span { color: rgba(255,255,255,0.8); }

.hero-card {
  padding: 1.2rem;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 28px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
}
.hero-card-inner {
  border-radius: 22px;
  overflow: hidden;
}
.mini-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 0.1rem 1rem;
  color: rgba(255,255,255,0.9);
  font-size: 0.82rem;
  font-weight: 700;
}
.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #2fe0a9;
  box-shadow: 0 0 18px rgba(47,224,169,0.8);
}
.video-box {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 340px;
  background: linear-gradient(135deg, rgba(22,125,154,0.7), rgba(20,43,74,0.72)),
    url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;
}
.video-box::before {
  content: '▶';
  display: grid;
  place-items: center;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background: rgba(255,255,255,0.92);
  color: var(--navy);
  font-size: 2.2rem;
  box-shadow: 0 16px 26px rgba(20,43,74,0.2);
}
.mini-panel,
.mini-grid {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 0 0;
  color: var(--white);
}
.mini-panel small,
.mini-grid small {
  display: block;
  color: rgba(255,255,255,0.7);
  margin-bottom: 0.25rem;
}
.mini-panel strong,
.mini-grid strong {
  color: var(--white);
}
.tag {
  display: inline-flex;
  padding: 0.42rem 0.7rem;
  border-radius: 999px;
  background: rgba(231,166,75,0.2);
  border: 1px solid rgba(231,166,75,0.4);
  color: #f8d38d;
  font-weight: 700;
  font-size: 0.72rem;
}
.mini-grid {
  margin-top: 0.6rem;
  padding-top: 0.75rem;
  border-top: 1px solid rgba(255,255,255,0.12);
}

.feature-grid,
.metrics-grid,
.value-grid,
.step-grid,
.auth-grid,
.contact-grid,
.about-grid,
.testimonial-box {
  display: grid;
  gap: 1.5rem;
}
.feature-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.value-grid, .step-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metrics-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.testimonial-box { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.about-grid, .contact-grid, .auth-grid { grid-template-columns: 1.1fr 0.9fr; }

.feature-card,
.value-card,
.step-card,
.info-card,
.course-card,
.testimonial,
.auth-panel,
.contact-card,
.metric-box,
.assistant-panel,
.assistant-sidebar {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow-soft);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.feature-card:hover,
.value-card:hover,
.step-card:hover,
.course-card:hover,
.metric-box:hover,
.testimonial:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 30px rgba(20, 43, 74, 0.08);
}
.feature-card .icon {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  margin-bottom: 1rem;
  background: rgba(22,125,154,0.12);
  color: var(--teal);
  font-size: 1.5rem;
}
.feature-card h3,
.value-card h3,
.step-card h3,
.info-card h3,
.metric-box h3 { margin-bottom: 0.45rem; }
.feature-card p,
.value-card p,
.step-card p,
.info-card p,
.metric-box p { margin: 0; }

.course-section {
  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(22,125,154,0.04) 100%);
}
.filter-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  margin-bottom: 2rem;
}
.filter-btn {
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--white);
  color: var(--navy);
  padding: 0.72rem 1rem;
  cursor: pointer;
  font-weight: 700;
}
.filter-btn.active {
  background: var(--navy);
  color: var(--white);
  border-color: var(--navy);
}
.course-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.5rem;
}
.course-card { overflow: hidden; padding: 0; }
.course-image {
  height: 190px;
  background-size: cover;
  background-position: center;
  position: relative;
}
.course-badge {
  position: absolute;
  top: 1rem;
  left: 1rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.75rem;
  border-radius: 999px;
  background: rgba(255,255,255,0.92);
  color: var(--navy);
  font-weight: 800;
  font-size: 0.72rem;
  border: 1px solid rgba(20,43,74,0.09);
}
.course-badge.available { color: #0d7d55; }
.course-badge.upcoming { color: #9d5a0f; }
.course-body { padding: 1.3rem 1.3rem 1.45rem; }
.course-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  color: var(--slate);
  margin-bottom: 0.8rem;
  font-size: 0.8rem;
}
.course-card h3 { margin-bottom: 0.5rem; }
.course-card p {
  margin-bottom: 1rem;
  font-size: 0.96rem;
}
.price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 1.1rem;
}
.price-tag {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.price-tag small {
  color: var(--slate);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.price-tag strong { font-size: 1.8rem; color: var(--navy); }
.course-card .link-btn {
  padding: 0.8rem 1rem;
  font-size: 0.82rem;
}
.metric-box strong {
  display: block;
  font-size: clamp(1.7rem, 3vw, 2.5rem);
  color: var(--navy);
  margin-bottom: 0.4rem;
}
.section-alt { background: var(--white); }
.testimonial {
  position: relative;
  padding-top: 2.5rem;
}
.testimonial::before {
  content: '“';
  position: absolute;
  top: 1rem;
  right: 1.25rem;
  font-size: 4rem;
  line-height: 1;
  color: rgba(20,43,74,0.08);
}

.footer {
  background: var(--navy);
  color: rgba(255,255,255,0.8);
  padding: 4rem 0 2rem;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.4fr repeat(3, minmax(0,1fr));
  gap: 2rem;
}
.footer-brand {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  margin-bottom: 1rem;
}
.footer-brand img { width: 52px; height: 52px; }
.footer h4 { color: var(--white); margin-bottom: 0.95rem; }
.footer ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.72rem;
}
.footer a, .footer span { color: rgba(255,255,255,0.78); }
.footer-bottom {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(255,255,255,0.12);
}

.page-hero {
  padding: 4.2rem 0 2.6rem;
  background: linear-gradient(135deg, rgba(20,43,74,0.96), rgba(22,125,154,0.9));
  color: var(--white);
}
.page-hero .container { display: grid; gap: 1rem; }
.page-hero h1, .page-hero p { color: var(--white); }
.page-hero .eyebrow {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.2);
  color: var(--white);
}
.info-card strong {
  display: inline-block;
  margin-bottom: 0.9rem;
  padding: 0.55rem 0.8rem;
  background: rgba(22,125,154,0.1);
  color: var(--teal);
  border-radius: 999px;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.auth-shell { padding: 4rem 0; }
.auth-panel { padding: 2rem; }
.auth-panel h2 { font-size: 2rem; }
.form-group { margin-bottom: 1rem; }
.form-group label {
  display: block;
  margin-bottom: 0.45rem;
  color: var(--navy);
  font-weight: 600;
}
.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0.95rem 1rem;
  background: #fff;
  color: var(--navy);
}
.form-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 1rem;
}
.inline-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
  color: var(--slate);
}
.checkbox {
  display: inline-flex;
  align-items: center;
  gap: 0.7rem;
  color: var(--slate);
}
.form-note {
  margin-top: 1rem;
  font-size: 0.92rem;
  color: var(--slate);
}
.social-auth {
  display: grid;
  gap: 0.8rem;
  margin-top: 1rem;
}
.social-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.8rem;
  padding: 0.9rem 1rem;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--white);
  font-weight: 700;
  color: var(--navy);
  cursor: pointer;
}
.social-btn.google { border-color: rgba(221, 76, 57, 0.2); }
.social-btn.apple { border-color: rgba(0,0,0,0.12); }

.ai-page { padding: 4rem 0; }
.ai-layout {
  display: grid;
  grid-template-columns: 0.8fr 1.2fr;
  gap: 1.5rem;
}
.assistant-panel,
.assistant-sidebar { min-height: 480px; }
.assistant-messages {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  max-height: 450px;
  overflow-y: auto;
  padding-right: 0.25rem;
}
.message {
  max-width: 85%;
  padding: 0.9rem 1rem;
  border-radius: 18px;
  line-height: 1.5;
}
.message.bot {
  background: rgba(22,125,154,0.08);
  color: var(--navy);
  border-bottom-left-radius: 6px;
}
.message.user {
  background: var(--navy);
  color: var(--white);
  margin-left: auto;
  border-bottom-right-radius: 6px;
}
.quick-prompts {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-top: 1rem;
}
.quick-prompt {
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--border);
  background: rgba(20,43,74,0.02);
  border-radius: 999px;
  color: var(--navy);
  font-weight: 600;
  cursor: pointer;
}
.assistant-form {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.8rem;
  margin-top: 1rem;
}
.assistant-form input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--light);
  padding: 0.9rem 1rem;
}
.alert {
  display: none;
  margin-top: 1rem;
  padding: 0.9rem 1rem;
  border-radius: 12px;
  font-weight: 600;
}
.alert.success {
  display: block;
  background: rgba(13, 125, 85, 0.08);
  color: #0d7d55;
  border: 1px solid rgba(13,125,85,0.15);
}
.alert.error {
  display: block;
  background: rgba(198,46,46,0.08);
  color: #b92929;
  border: 1px solid rgba(198,46,46,0.18);
}

@media (max-width: 980px) {
  .nav-links {
    position: absolute;
    left: 1rem;
    right: 1rem;
    top: calc(100% + 0.5rem);
    flex-direction: column;
    align-items: flex-start;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1rem;
    box-shadow: var(--shadow);
    display: none;
  }
  .nav-links.open { display: flex; }
  .mobile-toggle { display: inline-flex; }
  .hero-grid,
  .about-grid,
  .contact-grid,
  .auth-grid,
  .ai-layout,
  .footer-grid { grid-template-columns: 1fr; }
  .feature-grid,
  .metrics-grid,
  .course-grid,
  .value-grid,
  .step-grid,
  .testimonial-box { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .feature-grid,
  .metrics-grid,
  .course-grid,
  .value-grid,
  .step-grid,
  .testimonial-box,
  .form-row { grid-template-columns: 1fr; }
  .navbar { flex-wrap: wrap; padding: 0.8rem 0; }
  .nav-actions { width: 100%; justify-content: space-between; }
  .hero { padding-top: 2.8rem; }
  .hero-actions,
  .inline-row,
  .footer-bottom { flex-direction: column; align-items: flex-start; }
  .assistant-form { grid-template-columns: 1fr; }
}

